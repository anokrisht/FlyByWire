name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure tests
        run: cmake -S tests -B build/host-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build/host-tests --parallel

      - name: Run tests
        run: ctest --test-dir build/host-tests --output-on-failure
